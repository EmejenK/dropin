<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Multiple Blog Website</title>
    <link rel="stylesheet" href="style.css">
    <!-----Iconscout CDN-->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <!----Google fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@300;400;500;600;700;800;900&
    display=swap" rel="stylesheet">
</head>
<body>


<section class="form_section">
    <div class="container form_section-container">
        <h2>Sign Up</h2>
        <div class="alert_message error">
            <p>This is an error message.</p>
        </div>

        <form action="" enctype="multipart/form-data">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
            <input type="text" placeholder="Username Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Create Password">
            <input type="password" placeholder="Confirm Passowrd">
            <div class="form_control">
                <label for="avatar">Use Avatar</label>
                <input type="file" id="avatar">
            </div>

            <button type="submit" class="btn"> Sign Up</button>
            <small>Already have an account?<a href="sign-in.html"> Sign In</a></small>
        </form>
    </div>
</section>

</body>
</html>
